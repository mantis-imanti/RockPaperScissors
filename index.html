<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rock Paper Scissors</title>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
  <!-- TensorFlow -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

  <!-- Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
 <script>

    const URL =
    "https://teachablemachine.withgoogle.com/models/sBS7rUq_0/";


    let model;
    let webcam;


    async function init() {
      try {
    
        console.log("Iniciando...");
    
        console.log("tmImage:", tmImage);
    
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
    
        console.log("Cargando modelo...");
    
        model = await tmImage.load(modelURL, metadataURL);
    
        console.log("Modelo cargado");
    
        webcam = new tmImage.Webcam(400, 400, true);
    
        console.log("Cámara creando...");
    
        await webcam.setup();
    
        console.log("Cámara lista");
    
        await webcam.play();
    
        document.getElementById("webcam-container")
          .appendChild(webcam.canvas);
    
        requestAnimationFrame(loop);
    
      } catch (err) {
        console.error("FULL ERROR:", err);
        alert(err?.message || err);
      }
    }


    async function loop() {

      webcam.update();

      await predict();

      window.requestAnimationFrame(loop);
    }


    async function predict() {

      const prediction =
        await model.predict(webcam.canvas);


      let highest =
        prediction[0];


      prediction.forEach(p => {

        if (
          p.probability >
          highest.probability
        ) {

          highest = p;
        }

      });


      if (
        highest.probability > 0.90
      ) {

        document
          .getElementById("prediction")
          .innerHTML =

          `
            Detectado:
            <b>${highest.className}</b>
          `;
      }

    }

  </script>
  <style>

    body {

      background: #0f172a;

      color: white;

      font-family: Arial;

      text-align: center;

      padding: 30px;
    }

    button {

      padding: 14px 24px;

      border: none;

      border-radius: 12px;

      background: hotpink;

      color: white;

      font-size: 18px;

      cursor: pointer;

      margin-bottom: 20px;
    }

    canvas {

      border-radius: 20px;

      width: 100%;

      max-width: 400px;
    }

    #prediction {

      margin-top: 20px;

      font-size: 2rem;
    }

  </style>

</head>
<body>

  <h1>
    ✊✋✌️ Piedra, Papel, o Tijeras
  </h1>

  <button onclick="init()">
    Iniciar Cámara
  </button>

  <div id="webcam-container"></div>

  <div id="prediction"></div>

 

</body>
</html>
